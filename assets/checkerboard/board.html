<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkerboard calibration target - 9x6 squares, 24.0 mm</title>
<style>
  @page { size: 264mm 192mm; margin: 0 }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="264mm" height="192mm" viewBox="0 0 264 192" shape-rendering="crispEdges" text-rendering="geometricPrecision">
  <!-- 1 user unit = 1 mm. White page, no border. -->
  <rect x="0" y="0" width="264" height="192" fill="#FFFFFF"/>

  <!-- Checkerboard: 9 x 6 squares of 24.0 mm, origin (24,24) mm, top-left square BLACK -->
  <g fill="#000000">
    <rect x="24.0" y="24.0" width="24.0" height="24.0"/>
    <rect x="72.0" y="24.0" width="24.0" height="24.0"/>
    <rect x="120.0" y="24.0" width="24.0" height="24.0"/>
    <rect x="168.0" y="24.0" width="24.0" height="24.0"/>
    <rect x="216.0" y="24.0" width="24.0" height="24.0"/>
    <rect x="48.0" y="48.0" width="24.0" height="24.0"/>
    <rect x="96.0" y="48.0" width="24.0" height="24.0"/>
    <rect x="144.0" y="48.0" width="24.0" height="24.0"/>
    <rect x="192.0" y="48.0" width="24.0" height="24.0"/>
    <rect x="24.0" y="72.0" width="24.0" height="24.0"/>
    <rect x="72.0" y="72.0" width="24.0" height="24.0"/>
    <rect x="120.0" y="72.0" width="24.0" height="24.0"/>
    <rect x="168.0" y="72.0" width="24.0" height="24.0"/>
    <rect x="216.0" y="72.0" width="24.0" height="24.0"/>
    <rect x="48.0" y="96.0" width="24.0" height="24.0"/>
    <rect x="96.0" y="96.0" width="24.0" height="24.0"/>
    <rect x="144.0" y="96.0" width="24.0" height="24.0"/>
    <rect x="192.0" y="96.0" width="24.0" height="24.0"/>
    <rect x="24.0" y="120.0" width="24.0" height="24.0"/>
    <rect x="72.0" y="120.0" width="24.0" height="24.0"/>
    <rect x="120.0" y="120.0" width="24.0" height="24.0"/>
    <rect x="168.0" y="120.0" width="24.0" height="24.0"/>
    <rect x="216.0" y="120.0" width="24.0" height="24.0"/>
    <rect x="48.0" y="144.0" width="24.0" height="24.0"/>
    <rect x="96.0" y="144.0" width="24.0" height="24.0"/>
    <rect x="144.0" y="144.0" width="24.0" height="24.0"/>
    <rect x="192.0" y="144.0" width="24.0" height="24.0"/>
  </g>

  <!-- Instruction line (top margin) -->
  <text x="132" y="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="3.6" fill="#808080">PRINT AT 100% / ACTUAL SIZE - DO NOT USE 'FIT TO PAGE'</text>

  <!-- Verification scale bar: exactly 50.0 mm from x=24 to x=74 -->
  <g stroke="#000000" stroke-width="0.3" fill="none" stroke-linecap="butt">
    <line x1="24.0" y1="176.0" x2="74.0" y2="176.0"/>
    <line x1="24.0" y1="176.0" x2="24.0" y2="180.0"/>
    <line x1="29.0" y1="176.0" x2="29.0" y2="178.5"/>
    <line x1="34.0" y1="176.0" x2="34.0" y2="180.0"/>
    <line x1="39.0" y1="176.0" x2="39.0" y2="178.5"/>
    <line x1="44.0" y1="176.0" x2="44.0" y2="180.0"/>
    <line x1="49.0" y1="176.0" x2="49.0" y2="178.5"/>
    <line x1="54.0" y1="176.0" x2="54.0" y2="180.0"/>
    <line x1="59.0" y1="176.0" x2="59.0" y2="178.5"/>
    <line x1="64.0" y1="176.0" x2="64.0" y2="180.0"/>
    <line x1="69.0" y1="176.0" x2="69.0" y2="178.5"/>
    <line x1="74.0" y1="176.0" x2="74.0" y2="180.0"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="3" fill="#000000">
    <text x="24.0" y="184.0" text-anchor="middle">0</text>
    <text x="34.0" y="184.0" text-anchor="middle">10</text>
    <text x="44.0" y="184.0" text-anchor="middle">20</text>
    <text x="54.0" y="184.0" text-anchor="middle">30</text>
    <text x="64.0" y="184.0" text-anchor="middle">40</text>
    <text x="74.0" y="184.0" text-anchor="middle">50</text>
  </g>
  <text x="24" y="189.5" font-family="Arial, Helvetica, sans-serif" font-size="3.2" fill="#000000">50 mm - MEASURE THIS AFTER PRINTING</text>

  <!-- Spec block (bottom margin, right) -->
  <text x="240" y="177.5" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="3.2" fill="#000000">9 x 6 squares, 24.0 mm each, 100% scale</text>
</svg>
</body>
</html>
